name: Release Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'chart/**'
      - 'cmd/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Install Python deps
        run: pip3 install markdown

      - name: Read appVersion from Chart.yaml
        id: chart
        run: |
          APP_VERSION=$(awk '/^appVersion:/{gsub(/"/,"",$2); print $2}' chart/Chart.yaml)
          VERSION=$(awk '/^version:/{print $2}' chart/Chart.yaml)
          echo "appVersion=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Chart version: ${VERSION}, appVersion: ${APP_VERSION}"

      # Build + push the driver image. Idempotent: the manifest check below
      # skips the whole build (and the docker login that comes with it) if
      # an image with the same appVersion already lives on Docker Hub.
      # Image is pushed before the chart is packaged so consumers never see
      # a chart pinned to a non-existent image tag.
      - name: Check if image tag already exists on Docker Hub
        id: image_exists
        env:
          APP_VERSION: ${{ steps.chart.outputs.appVersion }}
        run: |
          # Public read needs no auth.
          if docker manifest inspect "yashgoyal04/csi-e2enetworks:${APP_VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image yashgoyal04/csi-e2enetworks:${APP_VERSION} already on Docker Hub — skipping build + push."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.image_exists.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.image_exists.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          username: yashgoyal04
          password: ${{ secrets.DOCKER_API_KEY }}

      - name: Build and push image
        if: steps.image_exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            yashgoyal04/csi-e2enetworks:${{ steps.chart.outputs.appVersion }}
            yashgoyal04/csi-e2enetworks:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package Helm Chart
        run: |
          mkdir -p ./pages
          helm package chart --destination ./pages

      - name: Generate Index
        run: |
          helm repo index ./pages \
            --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Render index.html from README
        run: |
          python3 << 'PY'
          import markdown
          with open('README.md', 'r', encoding='utf-8') as f:
              md_content = f.read()
          md = markdown.Markdown(extensions=['fenced_code', 'tables', 'nl2br'])
          html = md.convert(md_content)
          with open('/tmp/readme.html', 'w', encoding='utf-8') as f:
              f.write(html)
          PY
          cat > ./pages/index.html << EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>csi-e2enetworks Helm Chart Repository</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                     line-height: 1.6; color: #24292e; max-width: 900px; margin: 0 auto; padding: 20px; }
              h1, h2, h3 { color: #2664EB; }
              h1, h2 { border-bottom: 1px solid #eaecef; padding-bottom: 6px; }
              code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px;
                     font-family: 'SFMono-Regular', Consolas, monospace; font-size: 85%; }
              pre { background: #f6f8fa; border: 1px solid #e1e4e8; padding: 16px;
                    border-radius: 6px; overflow-x: auto; }
              pre code { background: transparent; padding: 0; }
              a { color: #2664EB; text-decoration: none; }
              a:hover { text-decoration: underline; }
              .repo-header { background: #f6f8fa; border: 1px solid #e1e4e8;
                             border-radius: 6px; padding: 20px; margin-bottom: 30px; }
              .repo-header code { background: #fff; border: 1px solid #e1e4e8;
                                  padding: 4px 8px; display: block; margin: 8px 0; }
            </style>
          </head>
          <body>
            <div class="repo-header">
              <h2>📦 csi-e2enetworks Helm Chart</h2>
              <p><strong>Add this repository:</strong></p>
              <code>helm repo add csi-e2enetworks https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}</code>
              <code>helm repo update</code>
              <p><strong>Install the chart:</strong></p>
              <code>helm install csi-e2enetworks csi-e2enetworks/csi-e2enetworks --namespace csi-e2enetworks --create-namespace -f my-values.yaml</code>
              <p style="margin-bottom: 0;">
                <a href="index.yaml">View index.yaml</a> |
                <a href="https://github.com/${{ github.repository }}">GitHub</a> |
                <a href="https://artifacthub.io/packages/helm/csi-e2enetworks/csi-e2enetworks">Artifact Hub</a>
              </p>
            </div>
            $(cat /tmp/readme.html)
          </body>
          </html>
          EOF

      - name: Copy artifacthub-repo.yml to pages
        run: |
          cp chart/artifacthub-repo.yml ./pages/artifacthub-repo.yml

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          keep_files: false

      # Create a GitHub Release for the packaged chart, tagged from
      # Chart.yaml's version. Idempotent: re-runs for the same version
      # silently no-op so README-only edits don't fail the workflow.
      - name: Create GitHub Release for chart version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(awk '/^version:/{print $2}' chart/Chart.yaml)
          APP_VERSION=$(awk '/^appVersion:/{gsub(/"/,"",$2); print $2}' chart/Chart.yaml)
          TAG="v${VERSION}"
          TGZ="./pages/csi-e2enetworks-${VERSION}.tgz"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          NOTES_FILE=$(mktemp)
          cat > "$NOTES_FILE" <<EOF
          Helm chart \`csi-e2enetworks\` v${VERSION} (appVersion ${APP_VERSION}).

          Container image: \`docker.io/yashgoyal04/csi-e2enetworks:${APP_VERSION}\`

          ## Install

          \`\`\`bash
          helm repo add csi-e2enetworks https://${GITHUB_REPOSITORY_OWNER}.github.io/csi-e2enetworks
          helm repo update
          helm install csi-e2enetworks csi-e2enetworks/csi-e2enetworks \\
            --namespace csi-e2enetworks --create-namespace \\
            --set e2e.apiKey=<UUID> \\
            --set e2e.authToken=<JWT> \\
            --set e2e.projectID=<numeric-project-id>
          \`\`\`

          See [README](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/README.md) for full options.
          EOF

          gh release create "$TAG" "$TGZ" \
            --title "csi-e2enetworks ${VERSION}" \
            --notes-file "$NOTES_FILE"
