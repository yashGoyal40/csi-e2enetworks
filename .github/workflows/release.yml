name: Release Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'chart/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Install Python deps
        run: pip3 install markdown

      - name: Package Helm Chart
        run: |
          mkdir -p ./pages
          helm package chart --destination ./pages

      - name: Generate Index
        run: |
          helm repo index ./pages \
            --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Render index.html from README
        run: |
          python3 << 'PY'
          import markdown
          with open('README.md', 'r', encoding='utf-8') as f:
              md_content = f.read()
          md = markdown.Markdown(extensions=['fenced_code', 'tables', 'nl2br'])
          html = md.convert(md_content)
          with open('/tmp/readme.html', 'w', encoding='utf-8') as f:
              f.write(html)
          PY
          cat > ./pages/index.html << EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>csi-e2enetworks Helm Chart Repository</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                     line-height: 1.6; color: #24292e; max-width: 900px; margin: 0 auto; padding: 20px; }
              h1, h2, h3 { color: #2664EB; }
              h1, h2 { border-bottom: 1px solid #eaecef; padding-bottom: 6px; }
              code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px;
                     font-family: 'SFMono-Regular', Consolas, monospace; font-size: 85%; }
              pre { background: #f6f8fa; border: 1px solid #e1e4e8; padding: 16px;
                    border-radius: 6px; overflow-x: auto; }
              pre code { background: transparent; padding: 0; }
              a { color: #2664EB; text-decoration: none; }
              a:hover { text-decoration: underline; }
              .repo-header { background: #f6f8fa; border: 1px solid #e1e4e8;
                             border-radius: 6px; padding: 20px; margin-bottom: 30px; }
              .repo-header code { background: #fff; border: 1px solid #e1e4e8;
                                  padding: 4px 8px; display: block; margin: 8px 0; }
            </style>
          </head>
          <body>
            <div class="repo-header">
              <h2>📦 csi-e2enetworks Helm Chart</h2>
              <p><strong>Add this repository:</strong></p>
              <code>helm repo add csi-e2enetworks https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}</code>
              <code>helm repo update</code>
              <p><strong>Install the chart:</strong></p>
              <code>helm install csi-e2enetworks csi-e2enetworks/csi-e2enetworks --namespace csi-e2enetworks --create-namespace -f my-values.yaml</code>
              <p style="margin-bottom: 0;">
                <a href="index.yaml">View index.yaml</a> |
                <a href="https://github.com/${{ github.repository }}">GitHub</a> |
                <a href="https://artifacthub.io/packages/helm/csi-e2enetworks/csi-e2enetworks">Artifact Hub</a>
              </p>
            </div>
            $(cat /tmp/readme.html)
          </body>
          </html>
          EOF

      - name: Copy artifacthub-repo.yml to pages
        run: |
          cp chart/artifacthub-repo.yml ./pages/artifacthub-repo.yml

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          keep_files: false
